name: Deploy to sia.alwafi.ac.id

on:
  push:
    branches: [main]

# Satu deploy dalam satu waktu; push baru antre, tidak saling timpa
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: self-hosted

    steps:
      - name: Update code to latest main
        run: |
          cd /home/ubuntu/siakadstit
          git fetch origin main
          git reset --hard origin/main

      - name: Install PHP dependencies
        run: |
          cd /home/ubuntu/siakadstit
          composer install --no-dev --no-interaction --prefer-dist \
            --optimize-autoloader --ignore-platform-req=php

      - name: Build frontend assets
        run: |
          cd /home/ubuntu/siakadstit
          npm ci --no-audit --no-fund
          npm run build

      - name: Backup database (best effort)
        run: |
          cd /home/ubuntu/siakadstit
          mkdir -p /home/ubuntu/db-backups
          DB_HOST=$(grep -E '^DB_HOST=' .env | cut -d= -f2)
          DB_PORT=$(grep -E '^DB_PORT=' .env | cut -d= -f2)
          DB_DATABASE=$(grep -E '^DB_DATABASE=' .env | cut -d= -f2)
          DB_USERNAME=$(grep -E '^DB_USERNAME=' .env | cut -d= -f2)
          DB_PASSWORD=$(grep -E '^DB_PASSWORD=' .env | cut -d= -f2-)
          if mysqldump -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" -p"$DB_PASSWORD" \
              "$DB_DATABASE" > "/home/ubuntu/db-backups/pre-deploy-$(date +%F_%H%M%S).sql" 2>/dev/null; then
            echo "Database backup OK"
            ls -t /home/ubuntu/db-backups/*.sql | tail -n +8 | xargs -r rm --
          else
            echo "WARNING: backup gagal, lanjut deploy"
          fi

      - name: Migrate database
        run: |
          cd /home/ubuntu/siakadstit
          php artisan migrate --force

      - name: Finalize (cache, link, permissions)
        run: |
          cd /home/ubuntu/siakadstit
          php artisan storage:link || true
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          sudo chown -R ubuntu:www-data storage bootstrap/cache
          sudo chmod -R 775 storage bootstrap/cache
          php artisan queue:restart || true

      - name: Health check
        run: |
          sleep 3
          curl -sf -o /dev/null https://sia.alwafi.ac.id/login
          echo "Site OK"
